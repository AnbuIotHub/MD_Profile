
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Karol G | Digital Visiting Card</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Social Media Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="page">

        <article class="digital-card">

            <!-- Decorative Glow -->
            <div class="ambient-glow"></div>

            <!-- Profile Photo -->
            <div class="portrait-frame">
                <img
                    src="assets/profile.png"
                    alt="Karol G Profile Photo"
                    class="portrait"
                >
            </div>

            <!-- Name and Designation -->
            <header class="identity">

                <h1>KAROL <span>G</span></h1>

                <p class="role">Managing Director</p>

                <div class="accent-line"></div>

            </header>

            <!-- Contact Information -->
            <section class="contact-list">

                <!-- Email -->
                <a
                    href="mailto:karol.md.anbuiot@gmail.com"
                    class="contact-row"
                >
                    <span class="contact-icon">
                        <i class="fa-regular fa-envelope"></i>
                    </span>

                    <span class="contact-text">
                        karol.md.anbuiot@gmail.com
                    </span>

                    <i class="fa-solid fa-arrow-up-right-from-square row-arrow"></i>
                </a>

                <!-- Phone -->
                <a
                    href="tel:+918428929599"
                    class="contact-row"
                >
                    <span class="contact-icon">
                        <i class="fa-solid fa-phone"></i>
                    </span>

                    <span class="contact-text">
                        +91 8428929599
                    </span>

                    <i class="fa-solid fa-arrow-up-right-from-square row-arrow"></i>
                </a>

            </section>

            <!-- Social Media -->
            <section class="social-section">

                <p class="social-heading">
                    CONNECT WITH ME
                </p>

                <div class="social-links">

                    <!-- LinkedIn -->
                    <a
                        href=""
                        class="social-button"
                        aria-label="LinkedIn"
                        title="LinkedIn"
                    >
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                    <!-- GitHub -->
                    <a
                        href="#"
                        class="social-button"
                        aria-label="GitHub"
                        title="GitHub"
                    >
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <!-- Instagram -->
                    <a
                        href="#"
                        class="social-button"
                        aria-label="Instagram"
                        title="Instagram"
                    >
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <!-- Personal Website -->
                    <a
                        href="#"
                        class="social-button"
                        aria-label="Website"
                        title="Website"
                    >
                        <i class="fa-solid fa-globe"></i>
                    </a>

                </div>

            </section>

        </article>

        <!-- Footer -->
        <footer class="page-note">
            <span>©</span> 2026 Karol G | Digital Identity
        </footer>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
